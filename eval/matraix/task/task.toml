version = "1.0"
artifacts = [ "/app/output",]

[task]
name = "application/fixcam-chat"

[metadata]
difficulty = "medium"
type = "chatbot"
domain = "home-repair"
tags = [ "fixcam", "multimodal", "video troubleshooting", "repair assistant", "imessage agent",]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1200.0

[environment]
definition = "application/shared-chat-persona"
local_compose = "application/chatbot-api-sidecar_fixcam"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
