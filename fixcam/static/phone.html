<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FixCam Camera</title>
<style>
  :root { --bg:#f2f2f7; --panel:#fff; --accent:#ff3b30; --text:#111; --muted:#6e6e73; --line:#d1d1d6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --panel:#1c1c1e; --text:#f5f5f7; --muted:#98989d; --line:#38383a; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:17px/1.4 -apple-system,system-ui,sans-serif; }
  main { max-width:480px; margin:0 auto; padding:24px 16px 40px; display:flex; flex-direction:column; gap:14px; }
  h1 { margin:0; font-size:28px; } p { margin:0; color:var(--muted); }
  label.big { display:flex; align-items:center; justify-content:center; gap:10px; background:var(--accent); color:#fff;
              border-radius:16px; padding:22px; font-size:20px; font-weight:600; cursor:pointer; }
  input[type=file] { display:none; }
  textarea { width:100%; border:1px solid var(--line); border-radius:12px; padding:12px; font:inherit; background:var(--panel); color:inherit; min-height:64px; }
  button { border:0; border-radius:14px; padding:16px; font:inherit; font-weight:600; background:var(--text); color:var(--bg); }
  button:disabled { opacity:.4; }
  #preview { width:100%; border-radius:14px; display:none; }
  #status { min-height:1.4em; font-weight:500; }
</style>
</head>
<body>
<main>
  <h1>FixCam 🔧</h1>
  <p>Stay on the FaceTime call. Snap what's broken and FixCam will talk you through the fix.</p>
  <label class="big">📷 Take photo or video<input id="file" type="file" accept="image/*,video/*" capture="environment"></label>
  <img id="preview" alt="">
  <textarea id="note" placeholder="Optional: what's happening? (e.g. it beeps and shows 4C)"></textarea>
  <button id="send" disabled>Send to FixCam</button>
  <div id="status"></div>
</main>
<script>
const file = document.getElementById("file"), send = document.getElementById("send"), status = document.getElementById("status"), preview = document.getElementById("preview");
file.onchange = () => {
  const f = file.files[0]; send.disabled = !f;
  if (f && f.type.startsWith("image")) { preview.src = URL.createObjectURL(f); preview.style.display = "block"; } else preview.style.display = "none";
  status.textContent = f ? f.name : "";
};
send.onclick = async () => {
  const fd = new FormData(); fd.append("note", document.getElementById("note").value); fd.append("files", file.files[0]);
  send.disabled = true; status.textContent = "Uploading…";
  try {
    const r = await (await fetch("/live/upload", {method:"POST", body:fd})).json();
    status.textContent = r.ok ? "✅ Sent! Go back to FaceTime — FixCam is looking at it." : "⚠️ " + r.error;
  } catch (e) { status.textContent = "⚠️ Upload failed: " + e; }
  send.disabled = false;
};
</script>
</body>
</html>
